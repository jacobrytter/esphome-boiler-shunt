# Valve controller - PI control of a motorized 3-way return shunt for a stoker boiler
# Hardware: LilyGO T-Display (ESP32; the display is not used), DS18B20, valve position sensor,
#           valve motor on 5 VDC: GPIO25 powers the motor, GPIO26 drives the direction optocoupler.
# Hardware revisions (the position sensor part lives in hw/, selected under "packages"):
#   Rev 1 (hw/rev1.yaml): potentiometer on the valve shaft (ADC, GPIO33) and a
#                         3.3 V relay module switching the motor supply.
#   Rev 2 (hw/rev2.yaml): AS5600 magnetic angle sensor (I2C, GPIO21/22) and a
#                         logic-level MOSFET module switching the motor supply.
# The control and motor logic lives in shunt.h.

packages:
  hardware: !include hw/rev2.yaml   # rev1.yaml for the potentiometer

substitutions:
  name: ventilregulator
  friendly_name: Ventilregulator
  invert_dir: "false"         # "true" if the valve turns the wrong way
  motor_inverted: "false"     # "true" if the motor switch (relay module) is active LOW
  fault_hold_position: "false"  # temperature sensor fault: "false" = close the shunt, "true" = hold position

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  build_path: C:/ProgramData/ESPHome/build/ventilregulator  # large folder, kept out of the repository and OneDrive
  includes:
    - shunt.h
    - datalog.h      # 4 h data log in RAM, served at /datalog
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto &c = shunt::ctl;
          c.end0 = id(g_end0);
          c.end100 = id(g_end100);
          c.p.invert_dir = ${invert_dir};
          c.p.fault_hold_position = ${fault_hold_position};
          c.loaded = true;

          // Data log: wall clock for the time stamps, and the /datalog pages
          datalog::dlog.now_epoch = []() -> time_t {
            auto t = id(sntp_time).now();
            return t.is_valid() ? t.timestamp : 0;
          };
          web_server_base::global_web_server_base->add_handler(new datalog::Handler());

          // Manual motor is for commissioning only; never come back up in it after a restart
          auto idx = id(mode).active_index();
          if (idx.has_value() && *idx == 2) {
            ESP_LOGW("shunt", "Mode was Manual motor at boot - switching to Auto");
            auto call = id(mode).make_call();
            call.set_index(0);
            call.perform();
          }

          // DS18B20: each sensor has a role with a stored address (see the "Temperature sensor
          // assign" buttons). A stored address is used even when the sensor does not answer,
          // so readings resume by themselves when it comes back. Only the very first sensor
          // is taken automatically, as the return sensor.
          auto devs = id(ow_bus)->get_devices();
          if (id(g_ds_addr) == 0 && devs.size() == 1 && (devs[0] & 0xff) == 0x28) {
            id(g_ds_addr) = devs[0];
            ESP_LOGI("shunt", "First DS18B20 0x%016llx stored as the return sensor", (unsigned long long) devs[0]);
          }
          for (uint64_t a : devs) {
            const char *role = a == id(g_ds_addr) ? "return" : a == id(g_ds_boiler) ? "boiler"
                             : a == id(g_ds_house) ? "house return" : "UNASSIGNED";
            ESP_LOGI("shunt", "1-Wire device 0x%016llx: %s", (unsigned long long) a, role);
          }
      - script.execute: ds_apply

esp32:
  board: esp32dev

logger:             # serial port 115200 baud, and over WiFi with "esphome logs"
  level: DEBUG
  logs:             # quiet the periodic sensor values; the "shunt" status line shows them
    sensor: INFO
    text_sensor: INFO
    binary_sensor: INFO

# ---------------------------------------------------------------- Network
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # IMPORTANT: the default is to reboot after 15 min without WiFi. The controller must keep running.
  reboot_timeout: 0s
  # Without a connection for 5 min, the hotspot opens so WiFi can be configured from a phone.
  # ESPHome keeps retrying the network (every 30 s) while the hotspot is open, and closes it
  # again as soon as the connection is back.
  ap:
    ssid: "Shuntventil"
    password: !secret ap_password
    ap_timeout: 5min

time:               # wall clock for the data log; the controller does not need it
  - platform: sntp
    id: sntp_time

captive_portal:     # WiFi setup via the hotspot (see README)
improv_serial:      # WiFi setup over USB from https://web.esphome.io

api:                # Home Assistant (optional)
  encryption:
    key: !secret api_key
  reboot_timeout: 0s  # the default is to reboot when Home Assistant is not connected

ota:                # protected by the API encryption key
  - platform: esphome

web_server:         # http://ventilregulator.local
  port: 80
  version: 3
  local: true
  sorting_groups:   # the web UI shows the entities in these groups, in this order
    - id: grp_overview
      name: "Overview"
      sorting_weight: 10
    - id: grp_manual
      name: "Manual control"
      sorting_weight: 15
    - id: grp_valve
      name: "Valve"
      sorting_weight: 20
    - id: grp_possensor
      name: "Position sensor"
      sorting_weight: 30
    - id: grp_controller
      name: "Controller tuning"
      sorting_weight: 40
    - id: grp_tempsensor
      name: "Temperature sensor"
      sorting_weight: 50
    - id: grp_system
      name: "System"
      sorting_weight: 60

# ---------------------------------------------------------------- Stored values
globals:
  - id: g_end0       # position sensor reading at 0 % (mV or degrees), learned automatically
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: g_end100     # position sensor reading at 100 %
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: g_ds_addr    # DS18B20 addresses per role (0 = not assigned): return after the pump,
    type: uint64_t   # boiler (pocket at the top of the boiler), house return (outside on the pipe)
    restore_value: true
    initial_value: "0"
  - id: g_ds_boiler
    type: uint64_t
    restore_value: true
    initial_value: "0"
  - id: g_ds_house
    type: uint64_t
    restore_value: true
    initial_value: "0"

# ---------------------------------------------------------------- I/O
one_wire:
  - platform: gpio
    id: ow_bus
    pin: GPIO27

output:
  - platform: gpio   # motor power: relay module (rev 1) or MOSFET module (rev 2) switching 5 VDC
    id: motor_out
    pin:
      number: GPIO25
      inverted: ${motor_inverted}
  - platform: gpio   # direction optocoupler (on = open shunt, with invert_dir: "false")
    id: dir_out
    pin:
      number: GPIO26  # through 330 Ω to the optocoupler LED

# ---------------------------------------------------------------- Settings
# Entity names start with their group (Valve, Position sensor, Controller, Temperature sensor,
# System), so Home Assistant's alphabetical lists keep them together too.
number:
  - platform: template
    id: setpoint
    name: "Setpoint"
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 80
    step: 0.5
    initial_value: 55
    optimistic: true
    restore_value: true
    mode: box
    web_server: {sorting_group_id: grp_overview, sorting_weight: 30}
  - platform: template
    id: manual_pos
    # Manual controls are named after the mode they belong to; using one selects that mode
    # (the web UI cannot grey out controls that do not apply)
    name: "Manual position target"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box           # the web UI slider is hard to drag (state updates interrupt the drag)
    set_action:         # only on a change from the UI/HA, not when restored at boot
      - lambda: |-
          auto idx = id(mode).active_index();
          if (!idx.has_value() || *idx != 1) {
            auto call = id(mode).make_call();
            call.set_index(1);
            call.perform();
          }
    web_server: {sorting_group_id: grp_manual, sorting_weight: 10}
  - platform: template
    id: travel
    name: "Valve travel time 0-100 %"
    unit_of_measurement: "s"
    min_value: 2
    max_value: 300
    step: 0.1
    initial_value: 5    # HH-Flo CR305: max 5 s per 90°
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_valve, sorting_weight: 50}
  - platform: template
    id: deadband
    name: "Valve deadband"
    unit_of_measurement: "%"
    min_value: 0.5
    max_value: 20
    step: 0.5
    initial_value: 3    # the smallest step the valve can make is about 3 % (dead time + coast-down)
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_valve, sorting_weight: 60}
  - platform: template
    id: kp
    name: "Controller Kp"
    unit_of_measurement: "%/°C"
    min_value: 0.1
    max_value: 50
    step: 0.1
    initial_value: 4
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_controller, sorting_weight: 10}
  - platform: template
    id: ti
    name: "Controller Ti"
    unit_of_measurement: "s"
    min_value: 10
    max_value: 5000
    step: 10
    initial_value: 150  # sensor 120 cm after the valve, behind the pump: short dead time
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_controller, sorting_weight: 20}

select:
  - platform: template
    id: mode
    name: "Mode"
    # Restored by index. "Manual motor" is never restored (see on_boot).
    options: ["Auto", "Manual position", "Manual motor"]
    initial_option: "Auto"
    optimistic: true
    restore_value: true
    web_server: {sorting_group_id: grp_overview, sorting_weight: 20}
  - platform: template
    id: valve_direction
    name: "Manual motor direction"
    options: ["Close", "Open"]
    initial_option: "Close"
    optimistic: true
    web_server: {sorting_group_id: grp_manual, sorting_weight: 20}

switch:
  # Runs the motor directly (Mode = Manual motor). Stops by itself at an end stop and after
  # 1.5 x the travel time. Turning it on switches Mode to "Manual motor".
  - platform: template
    id: valve_motor
    name: "Manual motor run"
    lambda: return shunt::ctl.p.jog_on;
    turn_on_action:
      - lambda: |-
          auto idx = id(mode).active_index();
          if (!idx.has_value() || *idx != 2) {
            auto call = id(mode).make_call();
            call.set_index(2);
            call.perform();
          }
          shunt::ctl.p.direct = true;
          shunt::ctl.p.jog_on = true;
    turn_off_action:
      - lambda: shunt::ctl.p.jog_on = false;
    web_server: {sorting_group_id: grp_manual, sorting_weight: 30}

button:
  - platform: template
    name: "Valve calibrate"
    entity_category: config
    on_press:
      - lambda: shunt::ctl.start_calibration();
    web_server: {sorting_group_id: grp_valve, sorting_weight: 40}
  - platform: restart
    name: "System restart"
    entity_category: config
    web_server: {sorting_group_id: grp_system, sorting_weight: 40}
  # Assign a new DS18B20: connect ONE new sensor, then press the button for its role. The bus
  # is searched again, and the only sensor without a role gets this one.
  - platform: template
    name: "Temperature sensor assign boiler"
    entity_category: config
    on_press: [script.execute: {id: ds_assign, role: 1}]
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 40}
  - platform: template
    name: "Temperature sensor assign house"
    entity_category: config
    on_press: [script.execute: {id: ds_assign, role: 2}]
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 50}
  - platform: template
    name: "Temperature sensor assign return"
    entity_category: config
    on_press: [script.execute: {id: ds_assign, role: 0}]
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 60}
  - platform: template
    name: "Temperature sensor search bus"
    entity_category: config
    on_press:
      - lambda: |-
          id(ow_bus)->search();
          ESP_LOGI("shunt", "1-Wire search: %u device(s)", (unsigned) id(ow_bus)->get_devices().size());
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 70}

script:
  - id: ds_apply       # give each DS18B20 sensor the stored address of its role
    then:
      - lambda: |-
          auto apply = [](dallas_temp::DallasTemperatureSensor *s, uint64_t a) {
            s->set_address(a);              // 0 = no sensor: no readings
            if (a == 0) s->publish_state(NAN);
          };
          apply(id(return_temp), id(g_ds_addr));
          apply(id(boiler_temp), id(g_ds_boiler));
          apply(id(house_temp), id(g_ds_house));
  - id: ds_assign      # role: 0 = return, 1 = boiler, 2 = house return
    parameters:
      role: int
    then:
      - lambda: |-
          static const char *const NAMES[] = {"return", "boiler", "house return"};
          id(ow_bus)->search();
          std::vector<uint64_t> fresh;
          for (uint64_t a : id(ow_bus)->get_devices())
            if ((a & 0xff) == 0x28 && a != id(g_ds_addr) && a != id(g_ds_boiler) && a != id(g_ds_house))
              fresh.push_back(a);
          if (fresh.size() != 1) {
            ESP_LOGW("shunt", "Assign %s: %u DS18B20 without a role on the bus - connect one new sensor at a time",
                     NAMES[role], (unsigned) fresh.size());
            return;
          }
          uint64_t &slot = role == 0 ? id(g_ds_addr) : role == 1 ? id(g_ds_boiler) : id(g_ds_house);
          slot = fresh[0];
          ESP_LOGI("shunt", "DS18B20 0x%016llx assigned as %s", (unsigned long long) fresh[0], NAMES[role]);
      - script.execute: ds_apply

# ---------------------------------------------------------------- Control
interval:
  # Motor control
  - interval: 20ms     # the valve moves 1 % in 50 ms
    then:
      - script.execute: read_position   # hw/rev*.yaml: feeds the position sensor to shunt::ctl
      - lambda: |-
          auto &c = shunt::ctl;
          c.p.sp = id(setpoint).state;
          c.p.kp = id(kp).state;
          c.p.ti = id(ti).state;
          c.p.travel = id(travel).state;
          c.p.db = id(deadband).state;
          c.p.man_pos = id(manual_pos).state;
          auto idx = id(mode).active_index();
          c.p.manual = idx.has_value() && *idx != 0;  // Manual position or Manual motor
          c.p.direct = idx.has_value() && *idx == 2;  // Manual motor
          auto dir = id(valve_direction).active_index();
          c.p.jog_open = dir.has_value() && *dir == 1;

          c.update(millis());
          id(dir_out).set_state(c.dir_on());
          id(motor_out).set_state(c.motor_on());

          char ev[112];
          while (c.next_event(ev, sizeof ev)) ESP_LOGI("shunt", "%s", ev);

          if (c.cal_dirty) {
            id(g_end0) = c.end0;
            id(g_end100) = c.end100;
            c.cal_dirty = false;
          }
          if (!std::isnan(c.new_travel)) {
            auto call = id(travel).make_call();
            call.set_value(c.new_travel);
            call.perform();
            c.new_travel = NAN;
          }
  # PI controller
  - interval: 10s
    then:
      - lambda: |-
          auto &c = shunt::ctl;
          c.tick(id(return_temp).state, 10.0f);
          datalog::dlog.add(millis() / 1000, c.temp(), id(boiler_temp).state, id(house_temp).state, c.p.sp, c.pos(), c.out(), c.integ(),
                            (c.p.manual ? datalog::F_MANUAL : 0) | (c.p.direct ? datalog::F_DIRECT : 0) |
                            (c.sensor_fault() ? datalog::F_SENSOR_FAULT : 0) |
                            (c.valve_fault() ? datalog::F_VALVE_FAULT : 0) |
                            (c.calibrating() ? datalog::F_CALIBRATING : 0),
                            c.starts());
          // Status line for debugging
          ESP_LOGI("shunt", "T=%.2f SP=%.1f | out=%.1f%% P=%.1f I=%.1f | pos=%.1f%% "
                   "sensor=%.1f%s (0%%=%.1f 100%%=%.1f) | coast=%.2f%% dead=%ums | %s | starts=%u",
                   c.temp(), c.p.sp, c.out(), c.p_term(), c.integ(), c.pos(),
                   c.sensor(), c.cfg.unit, c.end0, c.end100, c.lead(), (unsigned) c.dead_ms(),
                   c.state_text(), (unsigned) c.starts());
      - component.update: shunt_pos_s
      - component.update: shunt_target_s
      - component.update: p_term_s
      - component.update: i_term_s

# ---------------------------------------------------------------- Measurements
sensor:
  # DS18B20: no fixed addresses in the configuration. The address of each role is stored
  # (g_ds_addr, g_ds_boiler, g_ds_house) and set by the ds_apply script.
  - platform: dallas_temp
    id: return_temp
    name: "Return temperature"   # after the pump: the water going back into the boiler
    resolution: 12
    update_interval: 10s
    web_server: {sorting_group_id: grp_overview, sorting_weight: 40}
  - platform: dallas_temp
    id: boiler_temp
    name: "Boiler temperature"   # pocket at the top of the boiler
    resolution: 12
    update_interval: 10s
    web_server: {sorting_group_id: grp_overview, sorting_weight: 42}
  - platform: dallas_temp
    id: house_temp
    name: "House return temperature"   # outside on the return pipe from the house, insulated
    resolution: 12
    update_interval: 10s
    web_server: {sorting_group_id: grp_overview, sorting_weight: 44}

  # Process values are published together right after the controller tick (10 s interval),
  # so they come from the same moment as the temperatures and can be compared directly
  - platform: template
    id: shunt_pos_s
    name: "Shunt position"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: return shunt::ctl.pos();
    web_server: {sorting_group_id: grp_overview, sorting_weight: 50}
  - platform: template
    id: shunt_target_s
    name: "Shunt target"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: return shunt::ctl.out();
    web_server: {sorting_group_id: grp_overview, sorting_weight: 60}
  - platform: template
    name: "Valve coast-down"
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 60s
    entity_category: diagnostic
    lambda: return shunt::ctl.lead();
    web_server: {sorting_group_id: grp_valve, sorting_weight: 80}
  - platform: template
    name: "Valve dead time"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: return shunt::ctl.dead_ms();
    web_server: {sorting_group_id: grp_valve, sorting_weight: 90}
  - platform: template
    name: "Valve motor starts"
    unit_of_measurement: "starts"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    entity_category: diagnostic
    lambda: return shunt::ctl.starts();
    web_server: {sorting_group_id: grp_valve, sorting_weight: 100}
  - platform: template
    name: "Valve motor starts last hour"
    unit_of_measurement: "starts"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: return datalog::dlog.starts_last_hours(1);
    web_server: {sorting_group_id: grp_valve, sorting_weight: 110}
  - platform: template
    name: "Valve motor starts last 24 h"
    unit_of_measurement: "starts"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: return datalog::dlog.starts_last_hours(24);
    web_server: {sorting_group_id: grp_valve, sorting_weight: 120}
  - platform: template
    name: "Position sensor"
    unit_of_measurement: ${pos_unit}
    accuracy_decimals: ${pos_decimals}
    update_interval: 2s
    entity_category: diagnostic
    lambda: return shunt::ctl.sensor();
    filters: [delta: 0.2]
    web_server: {sorting_group_id: grp_possensor, sorting_weight: 10}
  - platform: template
    name: "Position sensor 0 %"
    unit_of_measurement: ${pos_unit}
    accuracy_decimals: ${pos_decimals}
    update_interval: 60s
    entity_category: diagnostic
    lambda: return shunt::ctl.end0;
    web_server: {sorting_group_id: grp_possensor, sorting_weight: 20}
  - platform: template
    name: "Position sensor 100 %"
    unit_of_measurement: ${pos_unit}
    accuracy_decimals: ${pos_decimals}
    update_interval: 60s
    entity_category: diagnostic
    lambda: return shunt::ctl.end100;
    web_server: {sorting_group_id: grp_possensor, sorting_weight: 30}
  - platform: template
    id: p_term_s
    name: "Controller P term"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
    entity_category: diagnostic
    lambda: return shunt::ctl.p_term();
    web_server: {sorting_group_id: grp_controller, sorting_weight: 30}
  - platform: template
    id: i_term_s
    name: "Controller I term"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
    entity_category: diagnostic
    lambda: return shunt::ctl.integ();
    web_server: {sorting_group_id: grp_controller, sorting_weight: 40}
  - platform: wifi_signal
    name: "System WiFi signal"
    update_interval: 60s
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_system, sorting_weight: 10}

text_sensor:
  - platform: template
    name: "Status"
    update_interval: 2s
    lambda: return {shunt::ctl.state_text()};
    web_server: {sorting_group_id: grp_overview, sorting_weight: 10}
  - platform: template
    name: "Valve calibration"
    update_interval: 2s
    entity_category: diagnostic
    lambda: return {shunt::ctl.cal_msg()};
    web_server: {sorting_group_id: grp_valve, sorting_weight: 45}
  - platform: template
    name: "Temperature sensor address return"
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      if (id(g_ds_addr) == 0) return {"not assigned"};
      char buf[17];
      snprintf(buf, sizeof buf, "%016llx", (unsigned long long) id(g_ds_addr));
      return {buf};
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 20}
  - platform: template
    name: "Temperature sensor address boiler"
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      if (id(g_ds_boiler) == 0) return {"not assigned"};
      char buf[17];
      snprintf(buf, sizeof buf, "%016llx", (unsigned long long) id(g_ds_boiler));
      return {buf};
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 22}
  - platform: template
    name: "Temperature sensor address house"
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      if (id(g_ds_house) == 0) return {"not assigned"};
      char buf[17];
      snprintf(buf, sizeof buf, "%016llx", (unsigned long long) id(g_ds_house));
      return {buf};
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 24}
  - platform: template
    name: "Temperature sensor unassigned"
    update_interval: 10s
    entity_category: diagnostic
    lambda: |-
      std::string s;
      char buf[20];
      for (uint64_t a : id(ow_bus)->get_devices()) {
        if (a == id(g_ds_addr) || a == id(g_ds_boiler) || a == id(g_ds_house)) continue;
        snprintf(buf, sizeof buf, "%s%016llx", s.empty() ? "" : ", ", (unsigned long long) a);
        s += buf;
      }
      return s.empty() ? std::string("none") : s;
    web_server: {sorting_group_id: grp_tempsensor, sorting_weight: 30}
  - platform: wifi_info
    ip_address:
      name: "System IP address"
      entity_category: diagnostic
